# A nightly release of main, made on demand: Actions > Nightly > Run workflow.
# It builds the Linux AppImage, the Windows ZIP and the macOS ZIP as the releases are built, and publishes them as a prerelease of the next minor
# version, such as v0.2.0-nightly.20261020.5. See docs/packaging.md.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor _ <<< "${current%%-*}"
          # The run number orders nightlies of one day and keeps each tag
          # new; the release's title names the commit.
          echo "version=$major.$((minor + 1)).0-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      # The AppImage's binary as an Arch package, in an Arch container.
      - run: scripts/package-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/linux/Yapfast-*
            target/dist/linux/yapfast-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      # The compiled dependencies. Before scripts/set-version, which changes
      # Cargo.lock, so the key changes only with the dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so Inno
      # Setup can't make the installer there.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  # The free Apple silicon runner: 3 cores, 7 GB and 14 GB of disk.
  macos:
    needs: version
    runs-on: macos-15
    env:
      # A compile of the UI crate takes 6-8 GiB; two at a time fit, three
      # ran a 24 GiB Mac out of memory.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      # What scripts/macos-env asks for; the runner has Xcode.
      - run: brew install rustup protobuf llvm@21
      # LiveKit's libwebrtc and the prepared Skia, which scripts/macos-env
      # downloads and checks.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/yapfast-build
          key: macos-build-${{ hashFiles('scripts/macos-env', 'nix/prepare-skia-native.py') }}
      # Before scripts/set-version, as in the Windows job.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      - name: Fetch the toolchain and crates
        run: scripts/macos-env cargo fetch --locked
      # Signed ad hoc and not notarized, as docs/packaging.md says.
      - run: scripts/build-macos discord
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/macos/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, linux, windows, macos]
    # A failed macOS build leaves the macOS ZIP out instead of holding back
    # Linux and Windows.
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      # Only for the notes' jq program.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        run: |
          # A failed request must fail the job, not leave the list empty.
          set -o pipefail
          # Both jobs zip the commit's source; SOURCE.txt and each BUILD.json
          # name the one file the release carries.
          cmp "dist/linux/Yapfast-$VERSION-source.zip" "dist/windows/Yapfast-$VERSION-source.zip"
          mkdir release
          mv dist/linux/Yapfast-* dist/linux/yapfast-*.pkg.tar.zst release/
          mv dist/windows/Yapfast-*-windows-x64* release/
          # The macOS app's BUILD.json names the source snapshot by its hash,
          # so it ships only with the same snapshot.
          if [ ! -d dist/macos ]; then
            echo "::warning::The macOS build failed; this nightly has no macOS ZIP."
          elif cmp "dist/linux/Yapfast-$VERSION-source.zip" "dist/macos/Yapfast-$VERSION-source.zip"; then
            mv dist/macos/Yapfast-*-macos-arm64.zip release/
          else
            echo "::warning::The macOS build zipped another source snapshot; this nightly has no macOS ZIP."
          fi
          (cd release && sha256sum Yapfast-* yapfast-*.pkg.tar.zst > SHA256SUMS.txt)
          # The newest nightly, or before the first one the latest release.
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq '[.[].tagName | select(contains("-nightly."))][0] // empty')
          if [ -z "$previous" ]; then
            previous=$(gh release view --json tagName --jq .tagName || true)
          fi
          {
            echo "A nightly build of main at $COMMIT, for testing what's coming in the next release. Expect rough edges."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              # The API lists at most 250 commits; the link below has them all.
              gh api "repos/$GH_REPO/compare/$previous...$COMMIT" | jq -r -f .github/nightly-notes.jq
              echo "All changes: https://github.com/$GH_REPO/compare/$previous...$COMMIT"
              echo
            fi
            echo "AppImage updaters take the AppImage to the latest stable release, not to newer nightlies."
            echo
            echo "On Arch Linux, install the .pkg.tar.zst with \`sudo pacman -U\` and its link."
            echo
            echo "The macOS ZIP is for Apple silicon and isn't notarized: allow Yapfast.app in System Settings › Privacy & Security after the first try to open it, or run \`xattr -dr com.apple.quarantine Yapfast.app\`."
          } > notes.md
          # Titled as the stable releases are, with the commit: the version
          # already says it's a nightly.
          gh release create "v$VERSION" release/* --prerelease --target "$COMMIT" \
            --title "Yapfast $VERSION (${COMMIT:0:7})" --notes-file notes.md
